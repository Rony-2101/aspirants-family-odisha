<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aspirants Family Odisha Admin</title><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="admin.js"></script></head><body><main><header><h1>Aspirants Family Odisha</h1><p>Simple Admin Panel</p></header><section id="loginCard" class="card"><h2>Admin Login</h2><form id="loginForm"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button>Login</button></form><p id="loginMsg"></p></section><section id="app" class="hidden"><div class="row"><h2>Recruitments</h2><button id="logout" class="alt">Logout</button></div><section class="card"><h3 id="heading">Add vacancy</h3><form id="jobForm"><input id="jobId" type="hidden"><label>Vacancy name<input id="title" required></label><label>Organization<input id="organization" required></label><label>Category<input id="category" value="Government Jobs"></label><label>Last date<input id="lastDate" type="date"></label><label>PDF link<input id="pdfUrl" type="url"></label><label>Apply link<input id="applyUrl" type="url"></label><label>Description<textarea id="description"></textarea></label><label class="check"><input id="active" type="checkbox" checked> Publish on website</label><div class="row"><button>Save vacancy</button><button type="button" id="clear" class="alt">Clear</button></div><p id="formMsg"></p></form></section><section class="card"><div class="row"><h3>Saved vacancies</h3><button id="refresh" class="alt" type="button">Refresh</button></div><div id="jobs">Loading…</div></section></section><footer>Admin access only</footer></main></body></html>
